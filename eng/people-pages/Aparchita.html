body{
    background:#0d1117;
    color:#f0f6fc;
    font-family:Inter, sans-serif;

    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

.container{

    color:#EFBF04;
    margin-bottom:15px;
}

p{
    color:#c9d1d9;
    margin-bottom:30px;
}

.loader{
    width:60px;
    height:60px;

    border:4px solid rgba(239,191,4,.15);
    border-top:4px solid #EFBF04;

    border-radius:50%;

    margin:auto;

    animation:spin 1s linear infinite;
}

@keyframes spin{
    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }
}
