
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080c18">
    <title>ATM | Building The Future</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        :root {
            --bg: #080c18;
            --accent: #f5c542;
            --text: #f5f7ff;
            --muted: #929bb0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .background {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(ellipse at 50% 110%, rgba(245,197,66,.13), transparent 55%),
                radial-gradient(ellipse at 85% 15%, rgba(75,95,160,.12), transparent 45%);
        }

        .grid {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
            background-size: 55px 55px;
            mask-image: linear-gradient(to bottom, transparent, black 35%, transparent);
        }

        main {
            position: relative;
            z-index: 1;
            width: min(100% - 40px, 560px);
            text-align: center;
            animation: appear .8s ease both;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            padding: 9px 15px;
            border: 1px solid rgba(245,197,66,.22);
            border-radius: 50px;
            background: rgba(245,197,66,.06);
            color: var(--accent);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 12px var(--accent);
        }

        .logo {
            font-size: clamp(85px, 18vw, 145px);
            font-weight: 800;
            letter-spacing: -12px;
            line-height: 1.3;
            margin: 15px 12px 0 0;
            background: linear-gradient(135deg, #fff 20%, #f5c542 80%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 45px rgba(245,197,66,.13));
        }

        .subtitle {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 5px;
            color: var(--accent);
            text-transform: uppercase;
            margin-top: -10px;
        }

        .divider {
            width: 45px;
            height: 2px;
            background: var(--accent);
            margin: 40px auto;
            opacity: .7;
        }

        h1 {
            font-size: clamp(25px, 5vw, 35px);
            letter-spacing: -1px;
            margin-bottom: 13px;
        }

        .description {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.8;
            margin-bottom: 35px;
        }

        .languages {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .language {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 9px;
            padding: 25px;
            text-decoration: none;
            color: white;
            background: rgba(255,255,255,.035);
            border: 1px solid rgba(255,255,255,.10);
            border-radius: 17px;
            text-align: left;
            transition: transform .25s, border-color .25s, background .25s;
        }

        .language:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
            background: rgba(245,197,66,.07);
        }

        .language:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 4px;
        }

        .flag {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .language strong {
            font-size: 19px;
        }

        .language small {
            color: var(--muted);
            font-size: 12px;
        }

        .arrow {
            position: absolute;
            right: 22px;
            bottom: 25px;
            font-size: 22px;
            color: var(--accent);
            transition: transform .25s;
        }

        .language:hover .arrow {
            transform: translateX(5px);
        }

        footer {
            margin-top: 55px;
            font-size: 11px;
            color: #626c82;
            letter-spacing: 1px;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 430px) {
            .languages {
                grid-template-columns: 1fr;
            }

            .language {
                padding: 20px;
            }

            .divider {
                margin: 28px auto;
            }

            footer {
                margin-top: 35px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>

    <div class="background"></div>
    <div class="grid"></div>

    <main>
        <div class="badge">
            <span class="dot"></span>
            Welcome to ATM
        </div>

        <div class="logo">ATM</div>
        <div class="subtitle">Building The Future</div>

        <div class="divider"></div>

        <h1>Choose your language.</h1>

        <p class="description">
            The future has no borders.<br>
            Select your language to explore our world.
        </p>

        <div class="languages">

            <a href="eng/" class="language" lang="en">
                <span class="flag" aria-hidden="true">🇬🇧</span>
                <strong>English</strong>
                <small>Explore ATM in English</small>
                <span class="arrow" aria-hidden="true">→</span>
            </a>

            <a href="ita/" class="language" lang="it">
                <span class="flag" aria-hidden="true">🇮🇹</span>
                <strong>Italiano</strong>
                <small>Esplora ATM in italiano</small>
                <span class="arrow" aria-hidden="true">→</span>
            </a>

        </div>

        <footer>
            © <span id="year"></span> ATM · BUILDING THE FUTURE
        </footer>
    </main>

    <script>
        document.getElementById('year').textContent =
            new Date().getFullYear();
    </script>

</body>
</html>
